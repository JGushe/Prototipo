name: prototipo_tesis
description: "Prototipo de tesis: gestión de tareas y monitoreo de uso de pantalla"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Base de datos local (SQLite) ---
  sqflite: ^2.4.3
  path: ^1.9.0
  path_provider: ^2.1.5

  # --- Monitoreo de uso de pantalla (Android) ---
  usage_stats: ^2.0.1

  # --- Notificaciones locales ---
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # --- Permisos ---
  permission_handler: ^12.0.3

  # --- Gráficos ---
  fl_chart: ^1.2.0

  # --- Fechas y formato ---
  intl: ^0.20.3

  # --- Iconos adicionales ---
  material_design_icons_flutter: ^7.0.7296

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
